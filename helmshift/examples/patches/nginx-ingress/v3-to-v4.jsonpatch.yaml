# JSON Patch (RFC 6902) for migrating nginx-ingress v3 to v4
# This file demonstrates JSON Patch operations in YAML format

# 1. Split image.repository into registry and image
- op: add
  path: /controller/image/registry
  value: registry.k8s.io

- op: add
  path: /controller/image/image
  value: ingress-nginx/controller

- op: remove
  path: /controller/image/repository

# 2. Rename config keys from kebab-case to camelCase
- op: add
  path: /controller/config/useForwardedHeaders
  value: "true"

- op: remove
  path: /controller/config/use-forwarded-headers

- op: add
  path: /controller/config/computeFullForwardedFor
  value: "true"

- op: remove
  path: /controller/config/compute-full-forwarded-for

- op: add
  path: /controller/config/proxyBodySize
  value: "10m"

- op: remove
  path: /controller/config/proxy-body-size

# 3. Move metrics from root to controller.metrics
- op: add
  path: /controller/metrics
  value:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

- op: remove
  path: /metrics

# 4. Remove deprecated defaultBackend
- op: remove
  path: /defaultBackend
