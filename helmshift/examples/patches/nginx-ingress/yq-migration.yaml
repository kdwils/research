# Migration configuration for yq expression format
fromVersion: "3.x"
toVersion: "4.0"
format: yq
description: |
  Migrates nginx-ingress chart values from v3 to v4 using yq expressions.

  This format provides a declarative way to define transformations using
  the powerful yq expression language.

patchFile: v3-to-v4.yq.yaml

validation:
  requiredFields:
    - controller
  forbiddenFields:
    - defaultBackend
    - metrics
