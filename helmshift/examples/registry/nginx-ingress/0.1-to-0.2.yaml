version: v1
chartName: nginx-ingress
fromVersion: "0.1.x"
toVersion: "0.2.0"
description: |
  Migrate nginx-ingress from v0.1 to v0.2

  Changes:
  - Split image.repository into registry and image fields
  - Rename config keys from kebab-case to camelCase

operations:
  # 1. Split image repository into registry and image
  - op: set
    path: controller.image.registry
    value: "registry.k8s.io"

  - op: copy
    from: controller.image.repository
    to: controller.image.image
    transform:
      type: stripPrefix
      params:
        prefix: "k8s.gcr.io/"

  - op: delete
    path: controller.image.repository

  # 2. Rename config keys from kebab-case to camelCase
  - op: copy
    from: controller.config.use-forwarded-headers
    to: controller.config.useForwardedHeaders

  - op: delete
    path: controller.config.use-forwarded-headers

  - op: copy
    from: controller.config.compute-full-forwarded-for
    to: controller.config.computeFullForwardedFor

  - op: delete
    path: controller.config.compute-full-forwarded-for

  - op: copy
    from: controller.config.proxy-body-size
    to: controller.config.proxyBodySize

  - op: delete
    path: controller.config.proxy-body-size
