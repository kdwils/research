apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor-dashboard
  namespace: health-monitor-system
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/component: dashboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: health-monitor
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-monitor
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: health-monitor-dashboard
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: k8s-service-health-monitor:latest
          imagePullPolicy: IfNotPresent
          command:
            - /dashboard
          args:
            - --bind-address=:8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor-dashboard
  namespace: health-monitor-system
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/component: dashboard
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/component: dashboard
