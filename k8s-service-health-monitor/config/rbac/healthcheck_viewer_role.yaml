# permissions for end users to view healthchecks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-service-health-monitor
    app.kubernetes.io/managed-by: kustomize
  name: healthcheck-viewer-role
rules:
- apiGroups:
  - monitoring.k8s.io
  resources:
  - healthchecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.k8s.io
  resources:
  - healthchecks/status
  verbs:
  - get
