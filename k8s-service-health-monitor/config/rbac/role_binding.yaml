apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor-controller
  namespace: health-monitor-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-monitor-dashboard
  namespace: health-monitor-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-monitor-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-monitor-controller-role
subjects:
  - kind: ServiceAccount
    name: health-monitor-controller
    namespace: health-monitor-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-monitor-dashboard-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-monitor-dashboard-role
subjects:
  - kind: ServiceAccount
    name: health-monitor-dashboard
    namespace: health-monitor-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-monitor-proxy-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: health-monitor-proxy-role
subjects:
  - kind: ServiceAccount
    name: health-monitor-controller
    namespace: health-monitor-system
