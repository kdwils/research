# Migration configuration for JSON Patch format
fromVersion: "3.x"
toVersion: "4.0"
format: jsonpatch
description: |
  Migrates nginx-ingress chart values from v3 to v4.

  Changes:
  - Splits image.repository into registry and image fields
  - Renames config keys from kebab-case to camelCase
  - Moves metrics configuration under controller
  - Removes deprecated defaultBackend configuration

patchFile: v3-to-v4.jsonpatch.yaml

validation:
  requiredFields:
    - controller
  forbiddenFields:
    - defaultBackend
    - metrics
