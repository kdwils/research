# Example nginx-ingress v4 values.yaml (after migration)
# This represents the new structure

controller:
  name: controller
  image:
    registry: registry.k8s.io  # Changed from repository
    image: ingress-nginx/controller  # Split from repository
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  # New configuration structure (moved under controller.config)
  config:
    useForwardedHeaders: "true"  # camelCase naming
    computeFullForwardedFor: "true"  # camelCase naming
    proxyBodySize: "10m"  # camelCase naming

  service:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    externalTrafficPolicy: Local
    ports:
      http: 80
      https: 443

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10

  # Metrics moved under controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

# Default backend removed (deprecated in v4)
# defaultBackend section no longer exists
